[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pendulumlab"
version = "0.1.0"
description = "A dependency-light inverted pendulum control benchmark with CEM policy search."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Ahmed Doghri" }]
keywords = ["robotics", "reinforcement-learning", "control", "cem", "simulation"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Intended Audience :: Developers",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.6"]

[project.urls]
Homepage = "https://github.com/ahmeddoghri/pendulumlab"

[tool.hatch.build.targets.wheel]
packages = ["pendulumlab"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E9", "F", "I"]
